# Keep Starship's default prompt modules; $all includes custom modules.
format = "$all"

palette = "catppuccin_mocha"

[directory]
# Show only the final path component for the current directory.
truncation_length = 1
truncate_to_repo = false

[custom.tun0_ip]
command = "ip -4 -o addr show dev tun0 scope global | tr -s ' ' | cut -d' ' -f4 | cut -d/ -f1 | head -n1"
when = "ip -4 -o addr show dev tun0 scope global | grep -q 'inet '"
format = "[tun0 $output]($style) "
style = "bold sapphire"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
